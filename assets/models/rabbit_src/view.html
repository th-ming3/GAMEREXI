<!doctype html><meta charset="utf-8"><body style="margin:0"><canvas id="c"></canvas><pre id="info" style="position:fixed;top:0;left:0;color:#111;background:#fff9;padding:8px;z-index:5"></pre><script src="../../../src/vendor/three.min.js"></script><script src="../../../src/vendor/FBXLoader.bundle.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8eadf);const camera=new THREE.PerspectiveCamera(35,900/700,.1,100);camera.position.set(2.8,1.9,3.8);camera.lookAt(0,.8,0);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});renderer.setSize(900,700);scene.add(new THREE.HemisphereLight(0xffffff,0x77705c,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-2,6,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x89975d}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);let mixer;new THREE.FBXLoader().load('./rabbit.fbx',g=>{const b=new THREE.Box3().setFromObject(g),s=b.getSize(new THREE.Vector3());g.scale.setScalar(1.6/s.y);b.setFromObject(g);g.position.y=-b.min.y;const tl=new THREE.TextureLoader();const fur=tl.load('./texture/Fur-skin.png');const skin=tl.load('./texture/rabbit-skinn.png');const norm=tl.load('./texture/rabbit-NORM.png');fur.colorSpace=skin.colorSpace=THREE.SRGBColorSpace;g.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.material=new THREE.MeshStandardMaterial({map:o.name==='Fur'?fur:skin,normalMap:norm,normalScale:new THREE.Vector2(.55,.55),color:0xffffff,roughness:.96,transparent:true,alphaTest:o.name==='Fur'?.25:.12,depthWrite:o.name!=='Fur',side:THREE.DoubleSide});}});scene.add(g);mixer=new THREE.AnimationMixer(g);let clips=g.animations;document.getElementById('info').textContent=JSON.stringify({size:s.toArray(),clips:clips.map(c=>c.name),m:g.children.map(o=>[o.name,o.isSkinnedMesh,o.material&&o.material.name])});const clip=clips.find(c=>c.name.toLowerCase().includes('running'))||clips[0];mixer.clipAction(clip).play();},undefined,e=>document.getElementById('info').textContent='ERROR '+e);let t=performance.now();function draw(){let n=performance.now();if(mixer)mixer.update(Math.min(.1,(n-t)/1000));t=n;renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
</script></body>
