<div id="bootSplash" role="status" aria-live="polite" aria-busy="true">
  <style>
    #bootSplash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;background:#f7ecdc;color:#68432d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #bootSplash .bootCard{width:min(100%,420px);padding:32px;border:1px solid rgba(122,90,52,.18);border-radius:20px;background:rgba(255,252,246,.82);box-shadow:0 20px 60px rgba(91,58,32,.12);text-align:center;backdrop-filter:blur(12px)}
    #bootSplash .bootMark{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 20px;animation:bootTurn 14s linear infinite}
    #bootSplash .bootMark svg{width:72px;height:72px;overflow:visible}
    #bootSplash .bootEyebrow{margin-bottom:8px;color:#9a7150;font-size:11px;font-weight:600;letter-spacing:.18em}
    #bootSplash .bootTitle{font:500 42px/1.1 Georgia,serif;letter-spacing:-.02em}
    #bootSplash .bootQuote{margin:8px 0 24px;color:#92745b;font:15px/1.5 Georgia,serif}
    #bootSplash .bootTrack{height:4px;overflow:hidden;border-radius:4px;background:#eadcc9}
    #bootSplash .bootFill{width:8%;height:100%;border-radius:4px;background:#b0532f;transition:width .45s ease}
    #bootSplash #bootStatus{margin-top:16px;color:#725037;font-size:14px;font-weight:600}
    #bootSplash #bootDetail{margin-top:6px;color:#9a806a;font-size:12px;line-height:1.5}
    #bootSplash .bootFoot{position:absolute;bottom:24px;max-width:calc(100vw - 48px);color:#9b7b60;font-size:11px;letter-spacing:.04em;text-align:center}
    @keyframes bootTurn{to{transform:rotate(360deg)}}
    @media(max-width:520px){#bootSplash .bootCard{padding:28px 20px}#bootSplash .bootTitle{font-size:36px}}
    @media(prefers-reduced-motion:reduce){#bootSplash .bootMark{animation:none}#bootSplash .bootFill{transition:none}}
  </style>
  <div class="bootCard">
    <div class="bootMark" aria-hidden="true">
      <svg viewBox="0 0 72 72" fill="none">
        <g fill="#d98a74">
          <ellipse cx="36" cy="17" rx="8" ry="14"/>
          <ellipse cx="36" cy="55" rx="8" ry="14"/>
          <ellipse cx="17" cy="36" rx="14" ry="8"/>
          <ellipse cx="55" cy="36" rx="14" ry="8"/>
        </g>
        <g fill="#e8b39a" transform="rotate(45 36 36)">
          <ellipse cx="36" cy="17" rx="8" ry="14"/>
          <ellipse cx="36" cy="55" rx="8" ry="14"/>
          <ellipse cx="17" cy="36" rx="14" ry="8"/>
          <ellipse cx="55" cy="36" rx="14" ry="8"/>
        </g>
        <circle cx="36" cy="36" r="11" fill="#c98f3e"/>
        <circle cx="36" cy="36" r="5" fill="#f6d994"/>
      </svg>
    </div>
    <div class="bootEyebrow">HÀNH TRÌNH NĂM VÙNG</div>
    <div class="bootTitle">Cánh Đồng</div>
    <p class="bootQuote">Nơi nước chảy có trí nhớ</p>
    <div class="bootTrack" aria-hidden="true"><div id="bootProgress" class="bootFill"></div></div>
    <div id="bootStatus">Đang chuẩn bị vườn</div>
    <div id="bootDetail">Ánh sáng, địa hình và những sinh vật đầu tiên</div>
  </div>
  <div class="bootFoot">Đồng Bình Minh · Rừng Thì Thầm · Hẻm Đá · Hồ Gương</div>
</div>
